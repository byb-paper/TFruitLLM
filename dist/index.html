<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="TropicalfruitLLM 1.0 is an evidence-grounded large language model for tropical fruit biology and breeding.">
  <title>TropicalfruitLLM 1.0: An Evidence-Grounded Large Language Model for Tropical Fruit Biology and Breeding</title>
  <link rel="stylesheet" href="portal.css?v=11">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#assistant" aria-label="TropicalfruitLLM 1.0 home">
      <img src="assets/tropifruit-logo-fruit-canopy.png" alt="TropicalfruitLLM 1.0 fruit canopy logo">
      <span><strong>TropicalfruitLLM 1.0</strong><small>TROPICAL FRUIT RESEARCH INTELLIGENCE</small></span>
    </a>
    <nav aria-label="Primary navigation"><a href="#assistant">Ask</a></nav>
  </header>

  <main>
    <section class="assistant-home" id="assistant">
      <div class="fruit-backdrop" aria-hidden="true">
        <img src="assets/tropical-fruit-13-hero-v3.png" alt="">
      </div>
      <h1>TropicalfruitLLM 1.0:</h1>
      <p class="model-title">An evidence-grounded large language model for tropical fruit biology and breeding</p>

      <div class="chat-panel">
        <div class="messages" id="messages"><div class="message model">Ask me about tropical fruit biology, genes or omics data.</div></div>
        <form id="chatForm">
          <label class="sr-only" for="question">Research question</label>
          <div class="composer"><input id="question" autocomplete="off" placeholder="Ask about a species, gene, trait or omics dataset…"><button aria-label="Send question">↑</button></div>
        </form>
      </div>
    </section>

  </main>

  <script src="portal.js?v=10"></script>
</body>
</html>
